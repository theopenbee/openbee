cmd:
  root:
    short: "OpenBee core service"
  config:
    short: "Interactively generate a config file"
  server:
    short: "Start the OpenBee server"
  stop:
    short: "Stop the running OpenBee daemon"
  restart:
    short: "Restart the OpenBee daemon"
  status:
    short: "Show the status of the OpenBee daemon"
  upgrade:
    short: "Upgrade openbee to the latest version"
    long: "Check for a new version and replace the current binary if one is available."
  backup:
    short: "Create a backup archive of the openbee database, config, and state"
  restore:
    short: "Restore openbee data from a backup archive"
  ctl:
    short: "Control the running openbee server"
  ctl_worker:
    short: "Manage workers"
    subs:
      list: "List all workers"
      get: "Get a worker by ID"
      status: "Get current status of a worker"
      create: "Create a new worker"
      update: "Update a worker (patch: omitted fields unchanged)"
      delete: "Delete a worker"
  ctl_task:
    short: "Manage tasks"
    subs:
      list: "List tasks (requires --session-key, --message-id, or --worker-id)"
      create: "Create a task"
      cancel: "Cancel a pending or running task"
  ctl_constraint:
    short: "Manage constraint entries"
    subs:
      get: "Read constraint entries (omit --key to list all in scope)"
      save: "Save or update a constraint entry"
      delete: "Delete a constraint entry"
  ctl_session:
    short: "Manage session contexts"
    subs:
      list: "List all agents with active session contexts for a session key"
      clear: "Cancel all active tasks and clear all session contexts for a session key"
      clear-worker: "Cancel one worker's active tasks and reset its session context within a session"
  ctl_system:
    short: "View system status overview"
    subs:
      overview: "Show system overview: worker status distribution, task stats"
  ctl_message:
    short: "Send messages to platform users"
    subs:
      send: "Send a message to the user on the originating platform"
      list: "List platform messages with optional filters"
      list-outbound: "List outbound (sent) messages with optional filters"
  ctl_department:
    short: "Manage departments"
    subs:
      list: "List all departments (tree structure)"
      get: "Get a department by ID or name"
      create: "Create a new department"
      update: "Update a department (patch: omitted fields unchanged)"
      delete: "Delete a department"
  service:
    short: "Manage openbee user-level autostart"
    install: "Install autostart and (by default) start the service immediately"
    uninstall: "Uninstall autostart"
    start: "Start the service via the OS service manager"
    stop: "Stop the service via the OS service manager"
    status: "Show autostart installation and run state"
