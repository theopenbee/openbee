version: 2

before:
  hooks:
    - go mod tidy
    - bash -c "cd web && pnpm install --frozen-lockfile && pnpm build"

builds:
  - id: openbee
    main: ./cmd/openbee/
    binary: openbee
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: theopenbee
    name: openbee
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

homebrew_casks:
  - repository:
      owner: theopenbee
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/theopenbee/openbee"
    description: "OpenBee 核心服务"
    license: ""

scoops:
  - repository:
      owner: theopenbee
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: "https://github.com/theopenbee/openbee"
    description: "OpenBee 核心服务"
    license: ""

nfpms:
  - id: openbee
    package_name: openbee
    vendor: OpenBee
    homepage: "https://github.com/theopenbee/openbee"
    maintainer: "OpenBee Team"
    description: "OpenBee 核心服务"
    license: ""
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents: []
