version: 2

before:
  hooks:
    - go mod tidy
    - bash -c "cd web && pnpm install --frozen-lockfile && pnpm build"

builds:
  - id: robobee
    main: ./cmd/robobee/
    binary: robobee
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE*
      - README*
      - config.example.yaml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: robobeedev
    name: robobee
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

homebrew_casks:
  - repository:
      owner: robobeedev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/robobeedev/robobee"
    description: "RoboBee 核心服务"
    license: ""

scoops:
  - repository:
      owner: robobeedev
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: "https://github.com/robobeedev/robobee"
    description: "RoboBee 核心服务"
    license: ""

nfpms:
  - id: robobee
    package_name: robobee
    vendor: RoboBee
    homepage: "https://github.com/robobeedev/robobee"
    maintainer: "RoboBee Team"
    description: "RoboBee 核心服务"
    license: ""
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: config.example.yaml
        dst: /etc/robobee/config.example.yaml
        type: config
