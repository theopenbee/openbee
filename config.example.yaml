server:
  port: 8080
  host: localhost

database:
  path: ./data/robobee.db

bee:
  claude:
    path: claude
    timeout: 30m
  mcp:
    api_key: ""
  platforms:
    feishu:
      enabled: false
      app_id: ""
      app_secret: ""
      max_media_size: 104857600  # 100MB，最大媒体下载大小（字节）
    dingtalk:
      enabled: false
      client_id: ""
      client_secret: ""
  feeder:
    interval: 1s
    batch_size: 10
    timeout: 5m
    queue_warn_threshold: 100
  message_debounce: 3s
