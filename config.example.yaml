server:
  port: 8080
  host: localhost
  debug: false

database:
  path: ./data/robobee.db

bee:
  claude:
    path: claude
    timeout: 30m
  mcp:
    api_key: ""
  platforms:
    feishu:
      enabled: false
      app_id: ""
      app_secret: ""
      max_media_size: 104857600  # 100MB，最大媒体下载大小（字节）
    dingtalk:
      enabled: false
      client_id: ""
      client_secret: ""
    wecom:
      enabled: false
      bot_id: "YOUR_BOT_ID"
      secret: "YOUR_BOT_SECRET"
      # websocket_url: wss://openws.work.weixin.qq.com  # optional, this is the default
  feeder:
    timeout: 5m
  media:
    ffprobe_path: ffprobe  # defaults to ffprobe on PATH
    ffmpeg_path: ffmpeg    # defaults to ffmpeg on PATH
  message_debounce: 3s
