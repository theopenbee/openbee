server:
  port: 8080
  host: localhost

database:
  path: ./data/robobee.db

runtime:
  claude_code:
    binary: claude
    timeout: 30m

mcp:
  api_key: ""  # Set a secret key to enable the MCP server endpoint

bee:
  message_debounce: 3s
  platforms:
    feishu:
      enabled: false
      app_id: ""
      app_secret: ""
    dingtalk:
      enabled: false
      client_id: ""
      client_secret: ""
  feeder:
    interval: 10s
    batch_size: 10
    timeout: 5m
    queue_warn_threshold: 100
