name: Desktop

on:
  push:
    paths:
      - "desktop/**"
      - "backend/**"
      - "web/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "backend/**"
      - "web/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build web
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Vet
        run: |
          go vet ./...
          go vet -tags=embedserver ./...
          go tool mygo vet .

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: |
          set -o pipefail
          {
            go test ./...
            go test -tags=embedserver ./internal/localserver/
          } 2>&1 | tee "$RUNNER_TEMP/desktop-test.log"

      - name: Report failed tests
        if: failure()
        run: |
          grep -E -- '--- FAIL|^FAIL|panic:|_test\.go:[0-9]+' "$RUNNER_TEMP/desktop-test.log" | head -60 | sed 's/^/::error::/' || true

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-log
          path: ${{ runner.temp }}/desktop-test.log

      - name: Cross-compile
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=amd64 go build -tags=embedserver ./...
          GOOS=linux GOARCH=amd64 go build -tags=embedserver ./...

  cross:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build web
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build
        env:
          GOFLAGS: -tags=embedserver
        run: go tool mygo build -platform windows/amd64,linux/amd64 -skip-dmg
