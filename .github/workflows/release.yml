name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

  cdn-upload:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          gh release download "${VERSION}" \
            --repo "${{ github.repository }}" \
            --pattern 'openbee-*-linux-amd64.tar.gz' \
            --pattern 'openbee-*-linux-arm64.tar.gz' \
            --pattern 'openbee-*-darwin-amd64.tar.gz' \
            --pattern 'openbee-*-darwin-arm64.tar.gz' \
            --pattern 'checksums.txt' \
            --dir dist/

      - name: Install ossutil
        run: curl -sL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Upload release assets to OSS
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          if [ -z "${OSS_ENDPOINT}" ] || [ -z "${OSS_BUCKET}" ]; then
            echo "OSS secrets not configured, skipping upload"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME}"
          ossutil cp dist/ "oss://${OSS_BUCKET}/releases/${VERSION}/" \
            --recursive \
            -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}"

      - name: Update latest version pointer
        # 只有稳定版（无 pre-release 后缀）才更新 latest 指针
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          if [ -z "${OSS_ENDPOINT}" ] || [ -z "${OSS_BUCKET}" ]; then
            echo "OSS secrets not configured, skipping latest pointer update"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME}"
          echo -n "${VERSION}" > /tmp/latest.txt
          ossutil cp /tmp/latest.txt "oss://${OSS_BUCKET}/releases/latest.txt" \
            --meta "Content-Type:text/plain;Cache-Control:no-cache" \
            -f \
            -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}"

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Download release binaries from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"   # e.g. v1.2.3
          mkdir -p dist
          gh release download "${VERSION}" \
            --repo "${{ github.repository }}" \
            --pattern 'openbee-*-linux-amd64.tar.gz' \
            --pattern 'openbee-*-linux-arm64.tar.gz' \
            --pattern 'openbee-*-darwin-amd64.tar.gz' \
            --pattern 'openbee-*-darwin-arm64.tar.gz' \
            --pattern 'openbee-*-windows-amd64.zip' \
            --pattern 'openbee-*-windows-arm64.zip' \
            --dir dist/

      - name: Extract binaries from archives
        run: |
          cd dist
          for f in *.tar.gz; do
            dir="${f%.tar.gz}"
            mkdir -p "$dir"
            tar -xzf "$f" -C "$dir"
          done
          for f in *.zip; do
            dir="${f%.zip}"
            mkdir -p "$dir"
            unzip -o "$f" -d "$dir"
          done

      - name: Prepare npm packages
        run: make npm-prepare

      - name: Publish to NPM
        run: bash npm/scripts/publish.sh
