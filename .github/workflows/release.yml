name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Download release binaries from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"   # e.g. v1.2.3
          mkdir -p dist
          gh release download "${VERSION}" \
            --pattern 'openbee-*-linux-amd64.tar.gz' \
            --pattern 'openbee-*-linux-arm64.tar.gz' \
            --pattern 'openbee-*-darwin-amd64.tar.gz' \
            --pattern 'openbee-*-darwin-arm64.tar.gz' \
            --pattern 'openbee-*-windows-amd64.zip' \
            --pattern 'openbee-*-windows-arm64.zip' \
            --dir dist/

      - name: Extract binaries from archives
        run: |
          cd dist
          for f in *.tar.gz; do
            dir="${f%.tar.gz}"
            mkdir -p "$dir"
            tar -xzf "$f" -C "$dir"
          done
          for f in *.zip; do
            dir="${f%.zip}"
            mkdir -p "$dir"
            unzip -o "$f" -d "$dir"
          done

      - name: Prepare npm packages
        run: make npm-prepare

      - name: Publish to NPM
        run: bash npm/scripts/publish.sh
